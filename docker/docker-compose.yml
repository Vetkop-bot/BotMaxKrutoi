networks:
  custom_network:
    driver: bridge

volumes:
  postgres_data:

services:
  web:
    image: nginx:1.27-alpine
    container_name: nginx-diplom
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html
    networks:
      - custom_network
    depends_on:
      - php-fpm
      - postgres
      - frontend

  php-fpm:
    image: bkl-project-php:latest
    container_name: php-fpm-diplom
    build:
      context: ./docker/php
      network: host
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-xdebug.ini
      - ./docker/php/zz-uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    networks:
      - custom_network
    depends_on:
      postgres:
        condition: service_healthy


  postgres:
    image: postgres:13.1
    container_name: postgres-diplom
    restart: always
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - custom_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_YANDEX_MAPS_API_KEY: ${VITE_YANDEX_MAPS_API_KEY:-}
    container_name: frontend-diplom
    restart: unless-stopped
    ports:
      - "5175:80"
    networks:
      - custom_network
    depends_on:
      - php-fpm
