# SportBuddy: PostgreSQL + MAX bot with HTTP API + mini app (nginx)
# Start: docker compose up -d --build   → http://localhost:8080

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sportbuddy}
      POSTGRES_USER: ${POSTGRES_USER:-sportbuddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sportbuddy}
      TZ: ${APP_TIMEZONE:-Europe/Moscow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: ./max-bot
    restart: unless-stopped
    env_file: ./max-bot/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sportbuddy}:${POSTGRES_PASSWORD:-sportbuddy}@postgres:5432/${POSTGRES_DB:-sportbuddy}
      PORT: 3000
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
      TZ: ${APP_TIMEZONE:-Europe/Moscow}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./webapp
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - bot

volumes:
  postgres_data:
